<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">PaperWeave understanding map</title>
  <desc id="desc">Six reading directions grow from a central understanding map. Choose one or more branches to explore in depth.</desc>
  <rect width="1120" height="480" rx="24" fill="#F8FAFC"/>
  <g fill="none" stroke-width="2">
