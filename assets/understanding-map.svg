    <path d="M448 240 H324" stroke="#78ACA9"/>
    <path d="M448 261 C383 261 396 383 324 383" stroke="#A8BBD2"/>
    <path d="M672 219 C737 219 724 97 796 97" stroke="#A8BBD2"/>
