    <text x="560" y="238" text-anchor="middle" font-size="21" font-weight="600" fill="#fff">Understanding</text>
    <text x="560" y="265" text-anchor="middle" font-size="21" font-weight="600" fill="#fff">Map</text>
    <g font-size="17" font-weight="600" fill="#233B53">
      <text x="76" y="88">Research problem</text>
      <text x="76" y="231">Methods &amp; models</text>
      <text x="76" y="374">Results &amp; evidence</text>
      <text x="820" y="88">Contributions</text>
      <text x="820" y="231">Assumptions &amp; limits</text>
      <text x="820" y="374">Your research</text>
