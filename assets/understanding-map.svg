    <rect x="52" y="194" width="272" height="92" rx="12"/>
    <rect x="52" y="337" width="272" height="92" rx="12"/>
    <rect x="796" y="51" width="272" height="92" rx="12"/>
    <rect x="796" y="194" width="272" height="92" rx="12"/>
